<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!--
      Error banner (injected dynamically by js/script.js):
      <div id="error-banner" class="error-banner" role="alert" aria-live="assertive">
        <p id="error-banner-message"></p>
        <button id="error-banner-close" aria-label="Dismiss error">x</button>
      </div>
    -->

    <header>
      <div class="header-top">
        <h1>Expense &amp; Budget Visualizer</h1>
        <!-- Feature 2: Dark / Light mode toggle -->
        <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle dark/light mode">
          &#9790;
        </button>
      </div>
      <div id="balance-display">Total Balance: $0.00</div>
      <!-- Feature 3: Spending limit warning -->
      <div id="limit-warning" hidden role="alert" aria-live="polite">
        <span id="limit-warning-text"></span>
      </div>
    </header>

    <main>
      <section id="form-section">
        <h2>Add Expense</h2>
        <form id="expense-form">
          <div class="field-group">
            <label for="item-name">Item Name</label>
            <input id="item-name" type="text" maxlength="100" />
            <span id="item-name-error" class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field-group">
            <label for="amount">Amount</label>
            <input id="amount" type="number" step="0.01" min="0.01" max="999999999.99" />
            <span id="amount-error" class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">-- Select --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span id="category-error" class="error-msg" aria-live="polite"></span>
          </div>
          <button type="submit">Add Transaction</button>
        </form>

        <!-- Feature 3: Monthly spending limit -->
        <div id="limit-section">
          <h3>Monthly Spending Limit</h3>
          <div class="limit-row">
            <label for="limit-input" class="sr-only">Set monthly spending limit</label>
            <input id="limit-input" type="number" step="0.01" min="0" placeholder="e.g. 500.00" />
            <button id="limit-set-btn" type="button">Set Limit</button>
          </div>
          <p id="limit-display" class="limit-hint"></p>
        </div>
      </section>

      <section id="chart-section">
        <h2>Spending by Category</h2>
        <canvas id="spending-chart"></canvas>
        <p id="chart-placeholder" hidden>No spending data yet.</p>
      </section>

      <section id="list-section">
        <!-- Feature 1: Sort controls -->
        <div class="list-header">
          <h2>Transactions</h2>
          <div class="sort-controls">
            <label for="sort-select" class="sr-only">Sort transactions</label>
            <select id="sort-select" title="Sort transactions">
              <option value="date-desc">Date (newest first)</option>
              <option value="date-asc">Date (oldest first)</option>
              <option value="amount-desc">Amount (highest first)</option>
              <option value="amount-asc">Amount (lowest first)</option>
              <option value="category-asc">Category (A &rarr; Z)</option>
            </select>
          </div>
        </div>
        <ul id="transaction-list"></ul>
      </section>
    </main>

    <!-- Chart.js must be loaded before js/script.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
